<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otak Kepo - Kenapa Kita Tidak Bisa Menggelitik Diri Sendiri</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b14;font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{width:540px;height:960px;position:relative;transform-origin:center center;flex:none;overflow:hidden;border-radius:18px;background:#1b1340}
  svg{position:absolute;inset:0;width:100%;height:100%}
  #cap{position:absolute;left:24px;right:24px;bottom:120px;text-align:center;color:#fff;font-weight:800;font-size:34px;line-height:1.25;
       text-shadow:0 3px 0 #000,0 0 14px rgba(0,0,0,.7);-webkit-text-stroke:1.5px #000;paint-order:stroke fill;z-index:5}
  #cap b{color:#ffe14d}
  #brand{position:absolute;top:18px;left:0;right:0;text-align:center;color:#ffffffcc;font-weight:700;letter-spacing:2px;font-size:15px;z-index:5}
  #bar{position:absolute;left:0;bottom:0;height:8px;background:#ffe14d;width:0;z-index:6}
  #start{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1b1340ee;color:#fff;gap:18px;text-align:center;padding:30px}
  #start h1{margin:0;font-size:30px;line-height:1.2}
  #start p{margin:0;opacity:.8;font-size:15px}
  button{font:inherit;font-weight:800;font-size:20px;padding:14px 34px;border:0;border-radius:40px;background:#ffe14d;color:#1b1340;cursor:pointer}
  #ctrl{position:fixed;right:14px;bottom:14px;display:flex;gap:8px;z-index:20}
  #ctrl button{font-size:14px;padding:8px 16px;background:#ffffff22;color:#fff}
  .scene{position:absolute;inset:0;opacity:0;transition:opacity .35s}
  .scene.on{opacity:1}

  /* animations */
  .pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  .fadein{animation:fadein .6s both}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .slideup{animation:slideup .6s cubic-bezier(.2,1,.3,1) both}
  @keyframes slideup{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
  .bob{animation:bob 1.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .laugh{animation:laugh .25s ease-in-out infinite}
  @keyframes laugh{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
  .wiggle{animation:wiggle .18s ease-in-out infinite alternate;transform-origin:0 0}
  @keyframes wiggle{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
  .pulse{animation:pulse 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .dash{stroke-dasharray:14 10;animation:dash 1s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-48}}
  .shake{animation:shake .12s linear infinite}
  @keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(4px,-3px)}50%{transform:translate(-4px,3px)}75%{transform:translate(3px,3px)}100%{transform:translate(0,0)}}
  .grow{animation:grow .7s cubic-bezier(.2,1.2,.4,1) both;transform-box:fill-box;transform-origin:center}
  @keyframes grow{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
  .d1{animation-delay:.3s}.d2{animation-delay:.8s}.d3{animation-delay:1.4s}.d4{animation-delay:2.2s}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div id="brand">OTAK KEPO</div>
    <div id="scenes"></div>
    <div id="cap"></div>
    <div id="bar"></div>
    <div id="start">
      <h1>Kenapa Kita Tidak Bisa<br>Menggelitik Diri Sendiri?</h1>
      <p>Video Shorts animasi · ±55 detik · suara narasi otomatis (aktifkan suara)</p>
      <button id="go">▶ Putar</button>
    </div>
  </div>
</div>
<div id="ctrl"><button id="mute">🔊 Suara: ON</button><button id="restart">⟲ Ulang</button></div>

<script>
// ---------- helpers ----------
const C = {skin:'#ffd9b0', line:'#fff', blue:'#5ec8ff', pink:'#ff7eb6', yellow:'#ffe14d', green:'#6dff9e', red:'#ff5a6e'};

// stickman centered at (x,y)=feet-center of torso top? we use (x,y)=neck point.
function man(x, y, o = {}) {
  const col = o.color || C.blue, face = o.face || 'smile', cls = o.cls || '';
  const eyes = face === 'laugh'
    ? `<path d="M-14 -50 q6 -8 12 0 M2 -50 q6 -8 12 0" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/>
       <path d="M-14 -34 q14 22 28 0 z" fill="#7a1f2b"/>`
    : face === 'think'
    ? `<circle cx="-8" cy="-48" r="3.5" fill="#222"/><circle cx="10" cy="-48" r="3.5" fill="#222"/><path d="M-10 -32 h20" stroke="#222" stroke-width="3" stroke-linecap="round"/>`
    : face === 'surprise'
    ? `<circle cx="-9" cy="-48" r="5" fill="#fff" stroke="#222" stroke-width="2.5"/><circle cx="9" cy="-48" r="5" fill="#fff" stroke="#222" stroke-width="2.5"/><ellipse cx="0" cy="-30" rx="6" ry="8" fill="#7a1f2b"/>`
    : `<circle cx="-8" cy="-48" r="3.5" fill="#222"/><circle cx="10" cy="-48" r="3.5" fill="#222"/><path d="M-10 -34 q10 10 20 0" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  const armL = o.armL || 'down', armR = o.armR || 'down';
  const arm = (side, mode) => {
    const s = side === 'L' ? -1 : 1;
    // shoulder at (s*0, 16)
    const paths = {
      down: `M0 0 L${s*26} 62`,
      up: `M0 0 L${s*50} -34`,
      reach: `M0 0 L${s*70} 20`,
      tickle: `M0 0 L${s*-4} 46`,       // hand crossing to own belly
    };
    const w = mode === 'wiggle' ? 'wiggle' : '';
    const d = mode === 'wiggle' ? paths.reach : (paths[mode] || paths.down);
    return `<g transform="translate(0,16)"><g class="${w}"><path d="${d}" stroke="${col}" stroke-width="9" stroke-linecap="round" fill="none"/></g></g>`;
  };
  return `<g transform="translate(${x},${y})"><g class="${cls}">
    <path d="M0 0 L0 90" stroke="${col}" stroke-width="10" stroke-linecap="round"/>
    <path d="M0 90 L-28 160 M0 90 L28 160" stroke="${col}" stroke-width="9" stroke-linecap="round" fill="none"/>
    ${arm('L', armL)}${arm('R', armR)}
    <circle cx="0" cy="-42" r="34" fill="${C.skin}" stroke="${col}" stroke-width="5"/>
    ${eyes}
  </g></g>`;
}

const bgStars = Array.from({length:26},(_,i)=>{
  const x=(i*97)%540, y=(i*151)%960, r=1+(i%3);
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity="${.15+(i%4)*.1}"/>`;
}).join('');

const title = (t, y=130) => `<text x="270" y="${y}" text-anchor="middle" fill="#fff" font-size="36" font-weight="800" class="slideup" font-family="Segoe UI,system-ui">${t}</text>`;

// ---------- scenes ----------
// text uses **bold** for highlight in captions
const scenes = [
  { // 1 HOOK
    text: 'Kenapa kamu **tidak bisa** menggelitik dirimu sendiri?',
    svg: () => `
      ${title('Coba deh…', 150)}
      ${man(270, 400, {color:C.blue, face:'think', armL:'tickle', armR:'tickle', cls:'bob'})}
      <g class="pop d2"><circle cx="400" cy="300" r="46" fill="#fff"/><text x="400" y="326" text-anchor="middle" font-size="64" font-weight="900" fill="#1b1340">?</text></g>
      <g class="pop d3"><text x="150" y="330" font-size="44">🤔</text></g>`
  },
  { // 2 orang lain bisa
    text: 'Padahal kalau **orang lain** yang menggelitik, kamu langsung ngakak!',
    svg: () => `
      ${title('Tapi kalau orang lain…', 150)}
      ${man(170, 420, {color:C.pink, face:'smile', armR:'wiggle', cls:'bob'})}
      ${man(380, 420, {color:C.blue, face:'laugh', armL:'up', armR:'up', cls:'laugh'})}
      <g class="pop d2"><text x="440" y="340" font-size="42">😂</text></g>
      <g class="pop d3"><text x="330" y="330" font-size="36">HAHA!</text></g>`
  },
  { // 3 cerebellum
    text: 'Rahasianya ada di otak kecil, atau **cerebellum**',
    svg: () => `
      ${title('Rahasianya ada di sini', 150)}
      <g transform="translate(270,430)"><g class="grow">
        <ellipse cx="0" cy="0" rx="150" ry="115" fill="#ff9ec4" stroke="#fff" stroke-width="5"/>
        <path d="M-90 -40 q40 -40 80 0 M10 -60 q40 -30 70 10 M-110 10 q50 30 100 0 M0 0 q50 40 100 0" stroke="#e0679b" stroke-width="6" fill="none" stroke-linecap="round"/>
        <ellipse cx="85" cy="85" rx="62" ry="38" fill="${C.yellow}" stroke="#fff" stroke-width="5" class="pulse"/>
        <path d="M45 85 h80 M52 100 h66 M52 70 h66" stroke="#c9a400" stroke-width="4" stroke-linecap="round"/>
      </g></g>
      <g class="slideup d3"><path d="M410 650 L355 545" stroke="${C.yellow}" stroke-width="5" marker-end="url(#ar)"/></g>
      <text x="400" y="690" text-anchor="middle" fill="${C.yellow}" font-size="32" font-weight="800" class="pop d3">Cerebellum</text>
      <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="${C.yellow}"/></marker></defs>`
  },
  { // 4 prediksi
    text: 'Dia selalu **memprediksi** gerakanmu sendiri, jadi otak sudah tahu kapan dan di mana sentuhannya',
    svg: () => `
      ${title('Otak sudah menebak', 150)}
      ${man(170, 450, {color:C.blue, face:'think', armL:'tickle', armR:'tickle'})}
      <g class="slideup d1">
        <rect x="285" y="330" width="210" height="110" rx="22" fill="#fff"/>
        <text x="390" y="372" text-anchor="middle" font-size="22" font-weight="800" fill="#1b1340">Prediksi otak:</text>
        <text x="390" y="410" text-anchor="middle" font-size="26" font-weight="900" fill="${C.red}">"Perut, 1 detik lagi"</text>
      </g>
      <path d="M215 470 C 250 520, 300 520, 330 470" stroke="${C.yellow}" stroke-width="5" fill="none" class="dash"/>
      <g class="pop d3"><text x="270" y="640" text-anchor="middle" font-size="70">🎯</text></g>`
  },
  { // 5 diredam
    text: 'Karena sudah ketebak, sinyal sentuhannya **diredam**. Hasilnya? Nggak terasa geli!',
    svg: () => `
      ${title('Sinyalnya dihapus', 150)}
      <g class="slideup d1">
        <rect x="60" y="300" width="190" height="120" rx="22" fill="${C.blue}"/>
        <text x="155" y="350" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">Sentuhan</text>
        <text x="155" y="392" text-anchor="middle" font-size="40" font-weight="900" fill="#fff">+100</text>
      </g>
      <text x="270" y="375" text-anchor="middle" font-size="64" font-weight="900" fill="#fff" class="pop d2">−</text>
      <g class="slideup d2">
        <rect x="290" y="300" width="190" height="120" rx="22" fill="${C.pink}"/>
        <text x="385" y="350" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">Prediksi</text>
        <text x="385" y="392" text-anchor="middle" font-size="40" font-weight="900" fill="#fff">100</text>
      </g>
      <g class="grow d4">
        <rect x="150" y="500" width="240" height="120" rx="26" fill="${C.green}"/>
        <text x="270" y="575" text-anchor="middle" font-size="64" font-weight="900" fill="#14301f">= 0</text>
      </g>
      <g class="pop d4"><text x="270" y="700" text-anchor="middle" font-size="64">😐</text></g>`
  },
  { // 6 kejutan
    text: 'Kalau **orang lain** yang menggelitik, otakmu tidak bisa menebak. Kejutan! Sinyal penuh, kamu pun geli!',
    svg: () => `
      ${title('Kejutan!', 150)}
      ${man(170, 430, {color:C.pink, face:'smile', armR:'wiggle'})}
      ${man(380, 430, {color:C.blue, face:'surprise', armL:'up', armR:'up', cls:'shake'})}
      <g class="pop d1"><text x="395" y="330" font-size="64">❗</text></g>
      <g class="slideup d3">
        <rect x="120" y="650" width="300" height="80" rx="20" fill="${C.yellow}"/>
        <text x="270" y="705" text-anchor="middle" font-size="36" font-weight="900" fill="#1b1340">Sinyal PENUH!</text>
      </g>
      <g class="pop d4"><text x="270" y="790" text-anchor="middle" font-size="60">😂😂</text></g>`
  },
  { // 7 bonus tikus
    text: 'Fakta bonus: **tikus** juga bisa "tertawa" saat digelitik, dengan suara yang terlalu tinggi untuk kita dengar!',
    svg: () => `
      ${title('Fakta bonus', 150)}
      <g class="grow">
        <text x="270" y="470" text-anchor="middle" font-size="190" class="laugh" style="transform-origin:270px 420px">🐭</text>
      </g>
      <g class="pop d2"><text x="120" y="330" font-size="50">😆</text></g>
      <g class="slideup d3">
        <path d="M380 300 q20 -30 40 0 t40 0 t40 0" stroke="${C.yellow}" stroke-width="6" fill="none" stroke-linecap="round" class="dash"/>
        <path d="M390 340 q20 -30 40 0 t40 0" stroke="${C.yellow}" stroke-width="6" fill="none" stroke-linecap="round" class="dash"/>
        <text x="270" y="650" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">Tawa ultrasonik 🔊</text>
      </g>`
  },
  { // 8 CTA
    text: 'Ikuti **Otak Kepo** buat fakta unik lainnya setiap hari!',
    svg: () => `
      <g class="grow"><circle cx="270" cy="400" r="130" fill="${C.yellow}"/><text x="270" y="445" text-anchor="middle" font-size="130">🧠</text></g>
      <text x="270" y="620" text-anchor="middle" fill="#fff" font-size="48" font-weight="900" class="slideup d2">OTAK KEPO</text>
      <g class="pop d3"><rect x="150" y="670" width="240" height="70" rx="35" fill="${C.red}"/>
        <text x="270" y="718" text-anchor="middle" font-size="30" font-weight="900" fill="#fff">+ IKUTI</text></g>`
  },
];

// ---------- player ----------
const stage = document.getElementById('stage');
const scenesEl = document.getElementById('scenes');
const cap = document.getElementById('cap');
const bar = document.getElementById('bar');
const startEl = document.getElementById('start');
let muted = false, playing = false, runId = 0, voice = null;

function fit(){
  const s = Math.min(innerWidth/560, innerHeight/980);
  stage.style.transform = `scale(${s})`;
}
addEventListener('resize', fit); fit();

function pickVoice(){
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v=>/id[-_]ID/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

const wait = ms => new Promise(r=>setTimeout(r,ms));
const plain = t => t.replace(/\*\*/g,'');
const html = t => t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');

function speak(text, id){
  return new Promise(res=>{
    const words = plain(text).split(/\s+/).length;
    const fallback = words/2.3*1000 + 600;
    if (muted || !('speechSynthesis' in window)) return setTimeout(res, fallback);
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(plain(text));
    u.lang = 'id-ID'; if (voice) u.voice = voice;
    u.rate = 1.0; u.pitch = 1.05;
    let done = false; const fin = ()=>{ if(!done){done=true;res();} };
    u.onend = fin; u.onerror = fin;
    speechSynthesis.speak(u);
    setTimeout(fin, fallback*1.8 + 1500); // safety
  });
}

async function play(){
  const id = ++runId; playing = true;
  scenesEl.innerHTML = ''; bar.style.width = '0';
  const els = scenes.map(s=>{
    const d = document.createElement('div'); d.className='scene';
    d.innerHTML = `<svg viewBox="0 0 540 960" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1a6e"/><stop offset="1" stop-color="#0f0a2a"/></linearGradient></defs>
      <rect width="540" height="960" fill="url(#g)"/>${bgStars}
      <g class="content"></g></svg>`;
    scenesEl.appendChild(d); return d;
  });
  for (let i=0;i<scenes.length;i++){
    if (id!==runId) return;
    // render fresh so CSS animations restart
    els[i].querySelector('.content').innerHTML = scenes[i].svg();
    els.forEach((e,j)=>e.classList.toggle('on', j===i));
    cap.innerHTML = html(scenes[i].text);
    bar.style.width = (i/scenes.length*100)+'%';
    const minHold = wait(2800);
    await Promise.all([speak(scenes[i].text, id), minHold]);
    await wait(250);
  }
  if (id!==runId) return;
  bar.style.width = '100%'; playing = false;
}

// ---------- deterministic render mode (dipakai render_mp4.py) ----------
const DURS = scenes.map(s => Math.max(3500, plain(s.text).split(/\s+/).length / 2.3 * 1000 + 900));
const TOTAL = DURS.reduce((a,b)=>a+b,0);
let rIdx = -1, rEls = null;
window.renderInfo = () => ({ total: TOTAL, durs: DURS });
window.renderAt = (t) => {
  if (!rEls){
    document.head.insertAdjacentHTML('beforeend','<style>.scene{transition:none!important}#start,#ctrl{display:none!important}#stage{transform:none!important;border-radius:0!important}#wrap{display:block!important}</style>');
    scenesEl.innerHTML='';
    rEls = scenes.map(()=>{
      const d=document.createElement('div'); d.className='scene';
      d.innerHTML=`<svg viewBox="0 0 540 960" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1a6e"/><stop offset="1" stop-color="#0f0a2a"/></linearGradient></defs><rect width="540" height="960" fill="url(#g)"/>${bgStars}<g class="content"></g></svg>`;
      scenesEl.appendChild(d); return d;
    });
  }
  let i=0, s=0; while (i<DURS.length-1 && t>=s+DURS[i]) { s+=DURS[i]; i++; }
  if (i!==rIdx){
    rIdx=i;
    rEls[i].querySelector('.content').innerHTML = scenes[i].svg();
    rEls.forEach((e,j)=>e.classList.toggle('on', j===i));
    cap.innerHTML = html(scenes[i].text);
  }
  bar.style.width = Math.min(100, t/TOTAL*100)+'%';
  const local = t - s;
  rEls[i].getAnimations({subtree:true}).forEach(a=>{ a.pause(); a.currentTime = local; });
};

document.getElementById('go').onclick = ()=>{ startEl.style.display='none'; play(); };
document.getElementById('restart').onclick = ()=>{ speechSynthesis.cancel(); startEl.style.display='none'; play(); };
document.getElementById('mute').onclick = e=>{
  muted = !muted; e.target.textContent = muted ? '🔇 Suara: OFF' : '🔊 Suara: ON';
  if (muted) speechSynthesis.cancel();
};
</script>
</body>
</html>
